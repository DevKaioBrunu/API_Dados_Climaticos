name: CI

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint e testes com cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Executar testes e verificar cobertura mínima
        run: npm run test:coverage -- --ci --runInBand
